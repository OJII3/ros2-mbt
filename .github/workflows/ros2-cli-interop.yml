name: ROS 2 CLI interoperability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ros2-cli-interop:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Update MoonBit package registry
        run: nix develop .#ros2 --command moon update

      - name: Run native test suite
        run: nix develop .#ros2 --command moon test --target native

      - name: Verify ROS 2 CLI topic and service interoperability
        env:
          ROS_DOMAIN_ID: "42"
          ROS_LOCALHOST_ONLY: "1"
          ROS2_MBT_IP: 127.0.0.1
        run: nix develop .#ros2 --command bash scripts/ros2_cli_interop.sh

      - name: Verify ROS 2 Action interoperability
        env:
          ROS_DOMAIN_ID: "42"
          ROS_LOCALHOST_ONLY: "1"
          ROS2_MBT_IP: 127.0.0.1
        run: nix develop .#ros2 --command bash scripts/ros2_action_interop.sh

      - name: Verify ROS 2 Parameter interoperability
        env:
          ROS_DOMAIN_ID: "42"
          ROS_LOCALHOST_ONLY: "1"
          ROS2_MBT_IP: 127.0.0.1
        run: nix develop .#ros2 --command bash scripts/ros2_parameter_interop.sh
