name: ROS 2 CLI interoperability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ROS_DOMAIN_ID: "42"
  ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET

jobs:
  build-image:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish candidate image with registry cache
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          cache="${image}-buildcache"
          local_image="localhost/ros2-mbt-jazzy:${GITHUB_SHA}"

          podman build \
            --layers \
            --cache-from "$cache" \
            --cache-to "$cache" \
            --file podman/ros2-jazzy/Containerfile \
            --tag "$local_image" \
            podman/ros2-jazzy

          podman tag "$local_image" "$image:$GITHUB_SHA"
          podman push "$image:$GITHUB_SHA"

  test-published-image:
    needs: build-image
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    env:
      ROS2_MBT_PODMAN_IMAGE: localhost/ros2-mbt-jazzy:${{ github.sha }}
      ROS2_MBT_PODMAN_BUILD: "0"
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull candidate image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          local_image="localhost/ros2-mbt-jazzy:${GITHUB_SHA}"
          podman pull "$image:$GITHUB_SHA"
          podman tag "$image:$GITHUB_SHA" "$local_image"

      - name: Prepare Podman environment
        run: bash scripts/ros2_podman_interop.sh start

      - name: Update MoonBit dependencies
        run: bash scripts/ros2_podman_interop.sh update

      - name: Check formatting
        run: bash scripts/ros2_podman_interop.sh fmt

      - name: Check types
        run: bash scripts/ros2_podman_interop.sh check

      - name: Run MoonBit tests
        run: bash scripts/ros2_podman_interop.sh test

      - name: Test ROS 2 CLI interoperability
        run: bash scripts/ros2_podman_interop.sh cli

      - name: Test ROS 2 action interoperability
        run: bash scripts/ros2_podman_interop.sh action

      - name: Test ROS 2 parameter interoperability
        run: bash scripts/ros2_podman_interop.sh parameter

      - name: Stop Podman environment
        if: always()
        run: bash scripts/ros2_podman_interop.sh stop

  test-pull-request:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    env:
      ROS2_MBT_PODMAN_IMAGE: localhost/ros2-mbt-jazzy:${{ github.sha }}
      ROS2_MBT_PODMAN_BUILD: "0"
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build candidate image with registry cache
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          cache="${image}-buildcache"
          local_image="localhost/ros2-mbt-jazzy:${GITHUB_SHA}"
          podman build \
            --layers \
            --cache-from "$cache" \
            --file podman/ros2-jazzy/Containerfile \
            --tag "$local_image" \
            podman/ros2-jazzy

      - name: Prepare Podman environment
        run: bash scripts/ros2_podman_interop.sh start

      - name: Update MoonBit dependencies
        run: bash scripts/ros2_podman_interop.sh update

      - name: Check formatting
        run: bash scripts/ros2_podman_interop.sh fmt

      - name: Check types
        run: bash scripts/ros2_podman_interop.sh check

      - name: Run MoonBit tests
        run: bash scripts/ros2_podman_interop.sh test

      - name: Test ROS 2 CLI interoperability
        run: bash scripts/ros2_podman_interop.sh cli

      - name: Test ROS 2 action interoperability
        run: bash scripts/ros2_podman_interop.sh action

      - name: Test ROS 2 parameter interoperability
        run: bash scripts/ros2_podman_interop.sh parameter

      - name: Stop Podman environment
        if: always()
        run: bash scripts/ros2_podman_interop.sh stop

  promote-main-image:
    needs: test-published-image
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Promote tested image to main
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          podman pull "$image:$GITHUB_SHA"
          podman tag "$image:$GITHUB_SHA" "$image:main"
          podman push "$image:main"
